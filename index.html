<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מצפן פיננסי - בינה פיננסית וניהול עושר</title>
    <meta name="description" content="פלטפורמת בינה פיננסית אישית לתכנון, סיווג מדויק, מעקב מטרות, השקעות וסימולציות עתידיות" />
    <meta property="og:title" content="מצפן פיננסי - בינה פיננסית וניהול עושר" />
    <meta property="og:description" content="פלטפורמת בינה פיננסית אישית לתכנון, סיווג מדויק, מעקב מטרות, השקעות וסימולציות עתידיות" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Ignore only specific Vite HMR WebSocket disconnection errors in AI Studio iframe environment
      function isViteHmrWebSocketError(msg, stack, filename) {
        msg = msg || '';
        stack = stack || '';
        filename = filename || '';
        // 1. Specific WebSocket closed without opened error
        if (msg.includes('WebSocket closed without opened') || stack.includes('WebSocket closed without opened')) {
          return true;
        }
        // 2. Explicit WebSocket error originating from @vite/client
        var isFromViteClient = filename.includes('@vite/client') || stack.includes('@vite/client');
        var isWsError = msg.toLowerCase().includes('websocket') || stack.toLowerCase().includes('websocket');
        if (isFromViteClient && isWsError) {
          return true;
        }
        return false;
      }

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        var stack = (reason && reason.stack) || '';
        if (isViteHmrWebSocketError(msg, stack, '')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        var filename = event.filename || '';
        var error = event.error;
        var stack = (error && error.stack) || '';
        if (isViteHmrWebSocketError(msg, stack, filename)) {
          event.preventDefault();
        }
      });
      (function() {
        try {
          var mode = localStorage.getItem('matzpen_theme_mode') || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] dark:bg-[#0B0F17] dark:text-slate-100 antialiased font-sans selection:bg-slate-700/20 selection:text-slate-900 dark:selection:bg-slate-500/30 dark:selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
